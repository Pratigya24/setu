spring.application.name=SETU-NGO-Donation-System

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/setu_db
spring.datasource.username=root
spring.datasource.password=Pratigy@1234

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.web.resources.static-locations=classpath:/static/,file:src/main/webapp/

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Mail (SMTP) Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=setu.notification@gmail.com
spring.mail.password=acqz vybo lnwx ynwx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server
# HTTPS is disabled by default for local development. Enable it with:
# SERVER_SSL_ENABLED=true, SERVER_SSL_KEY_STORE=file:/path/to/setu.p12,
# SERVER_SSL_KEY_STORE_PASSWORD=change-me, SERVER_SSL_KEY_STORE_TYPE=PKCS12
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store=${SERVER_SSL_KEY_STORE:}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:setu}
# Server
server.port=8080
